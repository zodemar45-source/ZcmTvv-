name: Build jar from zip
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip and build
        run: |
          unzip -q "$(ls *.zip | head -n 1)"
          cd TierPlugin
          mvn -B package
          cp target/TierPlugin-*.jar ../TierPlugin.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TierPlugin build ${{ github.run_number }}
          files: TierPlugin.jar
